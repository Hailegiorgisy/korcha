name: AI Coding Agent

on:
  issues:
    types: [labeled]

jobs:
  auto-code:
    if: github.event.label.name == 'bot-fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-generativeai

      - name: Run the AI Agent Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python .github/scripts/agent.py

      - name: Commit changes and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b ai-update-${{ github.event.issue.number }}
          git add .
          git commit -m "AI Agent: Addressed Issue #${{ github.event.issue.number }}"
          git push origin ai-update-${{ github.event.issue.number }}
          gh pr create --title "AI Fix for Issue #${{ github.event.issue.number }}" --body "Automated PR generated by free Gemini agent." --base main
