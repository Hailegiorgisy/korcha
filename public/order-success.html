<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - Korcha</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .status-card { max-width: 580px; margin: 60px auto; border-radius: 12px; }
    .badge-step { font-size: 0.85rem; padding: 6px 12px; border-radius: 20px; }
  </style>
</head>
<body>

<div class="container">
  <div class="card shadow-sm border-0 status-card p-4 text-center">
    <div class="mb-3">
      <span class="display-4 text-success">&#10003;</span>
    </div>
    <h3 class="fw-bold text-dark">Payment Confirmed!</h3>
    <p class="text-muted">Thank you for your order. We are now processing your procurement in China.</p>

    <div class="bg-light p-3 rounded my-3 text-start">
      <div class="d-flex justify-content-between mb-2">
        <span class="text-muted">Order Number:</span>
        <strong id="lblOrderNo">Loading...</strong>
      </div>
      <div class="d-flex justify-content-between mb-2">
        <span class="text-muted">Item:</span>
        <span id="lblTitle" class="fw-semibold text-truncate" style="max-width: 250px;">...</span>
      </div>
      <div class="d-flex justify-content-between mb-2">
        <span class="text-muted">Total Paid:</span>
        <strong id="lblTotal" class="text-primary">...</strong>
      </div>
      <div class="d-flex justify-content-between">
        <span class="text-muted">Pickup Location:</span>
        <span id="lblPickup" class="fw-semibold">...</span>
      </div>
    </div>

    <!-- Live Status Stepper -->
    <div class="my-4 text-start">
      <h6 class="fw-bold mb-3">Shipment Progress</h6>
      <div class="d-flex justify-content-between text-center small">
        <span id="step1" class="badge badge-step bg-success text-white">Paid</span>
        <span id="step2" class="badge badge-step bg-secondary text-white">Procured</span>
        <span id="step3" class="badge badge-step bg-secondary text-white">In Flight</span>
        <span id="step4" class="badge badge-step bg-secondary text-white">At Bole Hub</span>
      </div>
    </div>

    <a href="/" class="btn btn-outline-primary w-100 py-2 fw-semibold">Order Another Item</a>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const orderNo = params.get('order');

if (orderNo) {
  fetch(`/api/track/${orderNo}`)
    .then(r => r.json())
    .then(data => {
      if (data.order) {
        const o = data.order;
        document.getElementById('lblOrderNo').innerText = o.order_number;
        document.getElementById('lblTitle').innerText = o.product_title;
        document.getElementById('lblTotal').innerText = o.total_etb + ' ETB';
        document.getElementById('lblPickup').innerText = o.pickup_location || 'Bole Hub';

        // Update stepper badge highlights
        const stages = ['paid', 'procured', 'in_flight', 'ready_for_pickup'];
        const currentIdx = stages.indexOf(o.status);
        if (currentIdx >= 0) {
          for (let i = 0; i <= currentIdx; i++) {
            const el = document.getElementById(`step${i+1}`);
            if (el) el.className = 'badge badge-step bg-success text-white';
          }
        }
      }
    });
}
</script>

</body>
</html>
